<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoo - Jeux du jour</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="common.css?v=20260929e">
    <link rel="stylesheet" href="menu.css?v=20260930e">
</head>
<body>
    <div class="menu-page">
        <header>
            <h1 class="menu-title">Sudoo</h1>
            <button id="view-leaderboard-btn" class="btn btn-leaderboard">🏆 Classement</button>
        </header>

        <div class="game-menu">
            <a href="sudoku.html" class="game-card game-card-sudoku">
                <span class="game-card-badge">3 modes</span>
                <div class="game-card-icon game-card-icon-img"><img src="favicon.png" alt="Sudokoo"></div>
                <div class="game-card-info">
                    <h2>Sudokoo</h2>
                </div>
            </a>

            <a href="lettro.html" class="game-card game-card-lettro">
                <div class="game-card-icon game-card-icon-img"><img src="lettro-icon.png" alt="Rapidoo"></div>
                <div class="game-card-info">
                    <h2>Rapidoo</h2>
                </div>
            </a>

            <a href="mathoo.html" class="game-card game-card-mathoo">
                <div class="game-card-icon game-card-icon-img"><img src="mathoo-icon.png" alt="Mathoo"></div>
                <div class="game-card-info">
                    <h2>Mathoo</h2>
                </div>
            </a>

            <a href="deminoo.html" class="game-card game-card-deminoo">
                <span class="game-card-badge">Nouveau</span>
                <div class="game-card-icon game-card-icon-img"><img src="deminoo-icon.png" alt="Deminoo"></div>
                <div class="game-card-info">
                    <h2>Deminoo</h2>
                </div>
            </a>
        </div>

        <div class="menu-footer">
            <p>🏆 Un classement mondial différent pour chaque jeu, chaque jour</p>
        </div>
    </div>

    <!-- Modal classement -->
    <div id="leaderboard-modal" class="modal">
        <div class="modal-content leaderboard-content">
            <span class="close-btn" id="close-leaderboard">&times;</span>
            <h2>🏆 Classement Mondial</h2>
            <div class="leaderboard-tabs" id="game-tabs">
                <button class="leaderboard-tab active" data-game="sudoku"><img src="favicon.png" alt="" class="leaderboard-tab-icon"> Sudokoo</button>
                <button class="leaderboard-tab" data-game="lettro"><img src="lettro-icon.png" alt="" class="leaderboard-tab-icon"> Rapidoo</button>
                <button class="leaderboard-tab" data-game="mathoo"><img src="mathoo-icon.png" alt="" class="leaderboard-tab-icon"> Mathoo</button>
                <button class="leaderboard-tab" data-game="deminoo"><img src="deminoo-icon.png" alt="" class="leaderboard-tab-icon"> Deminoo</button>
            </div>
            <div class="leaderboard-tabs" id="sudoku-sub-tabs">
                <button class="leaderboard-tab active" data-difficulty="simple">📊 Simple</button>
                <button class="leaderboard-tab" data-difficulty="difficile">🏆 Difficile</button>
                <button class="leaderboard-tab" data-difficulty="blitz">⚡ Blitz</button>
            </div>
            <div class="leaderboard-header">
                <span class="rank-col">Rang</span>
                <span class="name-col">Joueur</span>
                <span class="time-col" id="leaderboard-result-label">Temps</span>
                <span class="date-col">Date</span>
            </div>
            <div id="leaderboard-list" class="leaderboard-list">
                <div class="loading">Chargement...</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="menu.js?v=20260930a"></script>
</body>
</html>
